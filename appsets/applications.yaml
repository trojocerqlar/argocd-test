apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/trojocerqlar/argocd-test.git
              revision: main
              files:
                - path: appsets/envs/*.yaml
          - list:
              elementsYaml: "{{ .services | toJson }}"
  template:
    metadata:
      name: '{{ .env }}-{{ .service }}'
      labels:
        env: '{{ .env }}'
        service: '{{ .service }}'
    spec:
      project: services
      sources:
        - repoURL:  https://charts.bitnami.com/bitnami
          chart: nginx
          targetRevision: '{{ .chartVersion }}'
          helm:
            releaseName: '{{ .service }}'
            valueFiles:
              - $values/apps/{{ .service }}/values.{{ .env }}.yaml
              - $values/apps/{{ .service }}/secrets.{{ .env }}.yaml
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/trojocerqlar/argocd-test.git
          targetRevision: main
          ref: values
      destination:
        name: 'in-cluster'
        namespace: cerqlar-{{ .env }}
  templatePatch: |
    {{- if hasKey . "url" }}
    metadata:
      annotations:
        link.argocd.argoproj.io/external-link: "{{ .url }}"
    {{- end }}
    spec:
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}